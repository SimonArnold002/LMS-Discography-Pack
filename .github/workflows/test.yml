# The builder's tests on the made-up dump, on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SimonArnold002/LMS-Discography
          ref: ${{ vars.DSC_REF || 'dev' }}
          path: dsc
          sparse-checkout: Discography/Sources.pm
          sparse-checkout-cone-mode: false
      - run: DSC_DIR="$PWD/dsc" python3 -m unittest discover -s tests -v
