# THE BUCKET REBUILD TEST (LMS-Discography docs/hosted-pack-plan.md §11, end). A keyed update re-sends
# every changed bucket whole: 53,851 buckets, 476.9 MB gzipped at 16,384 a kind for 20261028 -> 20261101
# (run 41350885542). Simon, 2026-11-01: "we should look to test for that next", "as long as it doesnt run
# us over any usage limits in our subscription". This run builds both dumps' hosted files as the hosted
# test does, then builder/entry_delta.py: only the ENTRIES that changed, each changed bucket with its
# canonical hash before and after, PROVEN (A + delta == B, every bucket). Then Node rebuilds a copy of
# A's keyed file from it with rebuild/patch.mjs, the Worker's own code, and every bucket of the result
# is held to B's list.
#
# The dumps are PINNED (inputs, defaults below): A is the file the Mac loads into D1 for the Cloudflare
# half of the test (the hosted test's 20261028 file), so the pair must not move to a newer dump.
# MusicBrainz keeps two full dumps: once a newer one is out, 20261028 is gone and this pair cannot run.
# Commits reports/edelta-<B>-run<run id>.txt; keeps the delta and the hash lists 14 days as an
# artifact. Publishes nothing; Cloudflare is not touched here.
name: Entry delta (bucket rebuild test)

on:
  push:
    branches: [hosted-test]
    paths:
      - .github/workflows/entry-delta.yml
      - builder/entry_delta.py
      - rebuild/**
      - tests/test_entry_delta.py
  workflow_dispatch:
    inputs:
      a:
        description: 'dump A (the file loaded into D1)'
        default: '20261028-002228'
      b:
        description: 'dump B'
        default: '20261101-125824'
      bits:
        description: 'buckets a kind, as a power of two'
        default: '14'

permissions:
  contents: write

concurrency:
  group: entry-delta
  cancel-in-progress: false

jobs:
  entry-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DSC_REF: ${{ vars.DSC_REF || 'dev' }}
      A: ${{ inputs.a || '20261028-002228' }}
      B: ${{ inputs.b || '20261101-125824' }}
      BITS: ${{ inputs.bits || '14' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: LMS-Discography's Sources.pm (the name keys of today's pack)
        uses: actions/checkout@v4
        with:
          repository: SimonArnold002/LMS-Discography
          ref: ${{ env.DSC_REF }}
          path: dsc
          sparse-checkout: Discography/Sources.pm
          sparse-checkout-cone-mode: false

      - name: The plugin code the suite runs (Sources.pm from DSC_REF, Pack.pm the copy in verify/plugin)
        run: |
          mkdir -p dscp/Discography
          cp dsc/Discography/Sources.pm dscp/Discography/
          cp verify/plugin/Pack.pm dscp/Discography/
          md5sum dscp/Discography/*.pm

      - name: Disk space and tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq && sudo apt-get install -y -qq lbzip2 libdbi-perl libdbd-sqlite3-perl libjson-xs-perl
          node -e "require('node:sqlite'); console.log('node', process.version, 'node:sqlite ok')"
          df -h . && free -g && nproc

      - name: Tests (the made-up dump; nothing is measured if they fail)
        run: DSC_DIR="$PWD/dscp" python3 -m unittest discover -s tests -v

      - name: Dump A - fetch, today's pack, the candidate tables, the alias keys, the hosted file, its entries
        run: |
          mkdir -p out
          python3 -I builder/measure_extra.py fetch "$A" work
          python3 -I builder/build_pack.py work out/base-A.db --dsc "$PWD/dsc" --dump "$A"
          python3 -I builder/measure_extra.py facts work out/facts-A.db > /dev/null
          python3 -I builder/hosted.py aliases out/base-A.db "$PWD/dsc" out/aliases-A.tsv
          rm -rf work
          python3 -I builder/hosted.py narrow out/base-A.db out/facts-A.db out/aliases-A.tsv out/hosted-A.db
          python3 -I builder/hosted.py entries out/hosted-A.db out/entries-A.db
          rm -f out/base-A.db out/facts-A.db out/aliases-A.tsv
          df -h .

      - name: Dump B - the same
        run: |
          python3 -I builder/measure_extra.py fetch "$B" work
          python3 -I builder/build_pack.py work out/base-B.db --dsc "$PWD/dsc" --dump "$B"
          python3 -I builder/measure_extra.py facts work out/facts-B.db > /dev/null
          python3 -I builder/hosted.py aliases out/base-B.db "$PWD/dsc" out/aliases-B.tsv
          rm -rf work
          python3 -I builder/hosted.py narrow out/base-B.db out/facts-B.db out/aliases-B.tsv out/hosted-B.db
          python3 -I builder/hosted.py entries out/hosted-B.db out/entries-B.db
          rm -f out/base-B.db out/facts-B.db out/aliases-B.tsv
          df -h .

      - name: The entry delta, proven
        run: |
          python3 -I builder/entry_delta.py make out/entries-A.db out/hosted-A.db out/entries-B.db out/hosted-B.db \
            "$BITS" keep > /dev/null
          ls -l keep

      - name: Node rebuilds A's keyed file from it (rebuild/patch.mjs, the Worker's code), held to B's list
        run: |
          python3 -I builder/hosted.py keyed out/entries-A.db out/hosted-A.db "$BITS" out/keyed-A.db > /dev/null
          python3 -I builder/entry_delta.py hashes out/keyed-A.db out/keyed-A-hashes.tsv.gz
          python3 -I builder/entry_delta.py same out/keyed-A-hashes.tsv.gz "keep/ahash-$BITS.tsv.gz"
          sha256sum out/keyed-A.db | tee keep/keyed-A.sha256
          node rebuild/apply_node.mjs out/keyed-A.db "keep/edelta-$BITS.jsonl.gz" out/node-hashes.tsv > keep/apply.json || true
          cat keep/apply.json
          python3 -I builder/entry_delta.py same out/node-hashes.tsv "keep/bhash-$BITS.tsv.gz" | tee same.txt || true
          jq --arg s "$(cat same.txt)" '. + {same: $s}' keep/apply.json > apply2.json && mv apply2.json keep/apply.json

      - name: The report
        if: always()
        run: |
          {
            echo "Entry delta test (bucket rebuild), run ${{ github.run_id }}, commit ${{ github.sha }}, dumps $A -> $B"
            python3 -I builder/entry_delta.py report "keep/edelta-$BITS.json" keep/apply.json 2>&1 \
              || echo 'NO MEASUREMENT: a step before it failed (see the run log)'
          } > report.txt
          cat report.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: edelta-${{ env.B }}
          path: keep/
          retention-days: 14
          compression-level: 0

      - name: Commit the report (also when a step failed)
        if: always()
        run: |
          mkdir -p reports
          cp report.txt "reports/edelta-$B-run${{ github.run_id }}.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports
          git commit -m "Entry delta test $B"
          git pull --rebase -q origin hosted-test
          git push origin HEAD:hosted-test
