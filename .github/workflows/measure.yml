# Where the pack's bytes go, and what applying a delta in place does to the
# file (a device never VACUUMs). Runs when this file or measure_pack.py is
# pushed, or by hand (Actions > Measure pack > Run workflow). Builds and
# publishes no pack; it reads published release assets and commits its report
# to reports/measure-<old>-<new>.txt, readable without a GitHub login.
#
#   old   the pack a device holds (blank = the second-newest release with a pack)
#   new   the next dump (blank = the newest); a delta old -> new must be published
#
# Measures the fresh old pack, old + delta applied exactly as the device does,
# and the fresh new pack. Compare "grown" with "new": the same rows, so any
# difference in size is the in-place apply.
name: Measure pack

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/measure.yml
      - builder/measure_pack.py
      - builder/compact_proto.py
  workflow_dispatch:
    inputs:
      old:
        description: 'dump of the pack a device holds (blank = second-newest)'
        default: ''
      new:
        description: 'dump the delta goes to (blank = newest)'
        default: ''

permissions:
  contents: write

concurrency:
  group: pack
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Which packs
        id: plan
        run: |
          mapfile -t tags < <(gh api "repos/$REPO/releases?per_page=20" \
            --jq '[.[] | select(any(.assets[]; .name | startswith("pack-"))) | .tag_name] | .[]')
          new="${{ inputs.new }}"; old="${{ inputs.old }}"
          [ -n "$new" ] || new="${tags[0]#pack-}"
          [ -n "$old" ] || old="${tags[1]#pack-}"
          [ -n "$old" ] && [ -n "$new" ] || { echo "::error::need two releases with a pack"; exit 1; }
          echo "old=$old" >> "$GITHUB_OUTPUT"; echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "old $old, new $new"
          sqlite3 --version || true
          python3 -c 'import sqlite3; print("python sqlite", sqlite3.sqlite_version)'

      - name: Download
        run: |
          old="${{ steps.plan.outputs.old }}"; new="${{ steps.plan.outputs.new }}"
          mkdir -p m
          gh release download "pack-$old" -R "$REPO" -p "pack-$old.db.gz" -D m
          gh release download "pack-$new" -R "$REPO" -p "pack-$new.db.gz" -p "delta-$old-$new.db.gz" -D m
          gunzip m/*.gz
          ls -l m

      - name: Measure
        run: |
          old="${{ steps.plan.outputs.old }}"; new="${{ steps.plan.outputs.new }}"
          python3 -I builder/measure_pack.py "m/pack-$old.db" "fresh $old" | tee report.txt
          python3 -I builder/measure_pack.py --grow "m/pack-$old.db" "m/delta-$old-$new.db" m/grown.db | tee -a report.txt
          python3 -I builder/measure_pack.py m/grown.db "grown: $old + delta -> $new (as on a device)" | tee -a report.txt
          python3 -I builder/measure_pack.py "m/pack-$new.db" "fresh $new" | tee -a report.txt
          # The stepped rewrite into the proposed format 4 (compact_proto.py): the grown file and the
          # fresh pack hold the same rows, so after the rewrite they must be the same size.
          echo "=== stepped rewrite of the grown file (format 4)" | tee -a report.txt
          python3 -I builder/compact_proto.py m/grown.db m/grown-f4.db 5000 | tee -a report.txt
          echo "=== stepped rewrite of the fresh $new pack (format 4)" | tee -a report.txt
          python3 -I builder/compact_proto.py "m/pack-$new.db" m/fresh-f4.db 5000 | tee -a report.txt
          python3 -I builder/measure_pack.py m/fresh-f4.db "format 4 from fresh $new" | tee -a report.txt
          # What a device would do after a delta: each table copied in ONE statement (packs pages
          # as VACUUM does), yielding between tables. The longest table = the longest LMS wait.
          echo "=== table-by-table rewrite of the grown file (format 4)" | tee -a report.txt
          python3 -I builder/compact_proto.py --whole m/grown-f4.db m/grown-whole.db | tee -a report.txt
          echo "=== table-by-table rewrite of the fresh $new pack (format 4)" | tee -a report.txt
          python3 -I builder/compact_proto.py --whole m/fresh-f4.db m/fresh-whole.db | tee -a report.txt
          python3 -I - m/grown-whole.db m/fresh-whole.db <<'EOF' | tee -a report.txt
          import sqlite3, sys
          a, b = sys.argv[1:]
          c = sqlite3.connect(':memory:'); c.execute('ATTACH ? AS a', (a,)); c.execute('ATTACH ? AS b', (b,))
          bad = 0
          for (t,) in c.execute("SELECT name FROM a.sqlite_master WHERE type='table'").fetchall():
              for x, y in (('a', 'b'), ('b', 'a')):
                  n = c.execute(f'SELECT count(*) FROM (SELECT * FROM {x}.{t} EXCEPT SELECT * FROM {y}.{t})').fetchone()[0]
                  if n: bad += 1; print(f'  {t}: {n} rows in {x} not in {y}')
          import os
          print(f'grown, rewritten {os.path.getsize(a):,} B vs fresh, rewritten {os.path.getsize(b):,} B; tables differ: {bad}')
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-measure
          path: report.txt

      - name: Commit the report (also when a step failed, so the partial report is readable)
        if: always()
        run: |
          old="${{ steps.plan.outputs.old }}"; new="${{ steps.plan.outputs.new }}"
          mkdir -p reports
          cp report.txt "reports/measure-$old-$new.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports
          git commit -m "Measure report $old -> $new"
          git pull --rebase -q origin main
          git push
