# Builds one MusicBrainz dump into the keyed data file, cuts it into parts with a manifest, and publishes them as the
# release data-<dump>. Runs once a day (a day with no new dump builds nothing: about two minutes) and by hand.
# Nothing here reads or writes anything but MusicBrainz's dump and this repo.
name: Build

on:
  # Off the hour: GitHub delays and can drop scheduled runs at busy times, the start of an hour above all. A dump's
  # files are complete about five hours after the time in its name (00:2x); a run a day means no dump day is assumed.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      dump:
        description: 'fullexport dump name (blank = the newest)'
        default: ''
      force:
        description: 'Build even if this dump is already published'
        type: boolean
        default: false
      mb_part:
        description: 'MB a part'
        default: '32'
      keep:
        description: 'Releases to keep (the newest ones; older are deleted after a build)'
        default: '2'
      mark:
        description: 'Write the last-run file now (else only when the newest commit is two weeks old)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Inputs reach the shell as variables only, never as text pasted into a script. The token that can publish is given
    # to the three steps that publish or ask about releases, and to no step that runs the build's own code.
    env:
      # LMS-Discography's commit whose Sources.pm makes the name keys: ONE commit, by its full id, never a branch
      # (a branch moves, and what it holds is run here). Changed on purpose, with the plugin's name keys.
      DSC_REF: ${{ vars.DSC_REF || 'ef6f87b2cfd7e3ac05e7f3986fef3893947b3e8c' }}
      DUMP: ${{ inputs.dump }}
      FORCE: ${{ inputs.force }}
      MB: ${{ inputs.mb_part || '32' }}
      KEEP: ${{ inputs.keep || '2' }}
      MARK: ${{ inputs.mark }}
    steps:
      - name: The inputs, checked before anything runs
        run: |
          case "$DSC_REF" in *[!0-9a-f]*) echo "DSC_REF: a full commit id, please"; exit 1 ;; esac
          [ "${#DSC_REF}" -eq 40 ] || { echo "DSC_REF: a full commit id (40 characters), please"; exit 1; }
          case "$DUMP" in *[!0-9-]*) echo "not a dump name: $DUMP"; exit 1 ;; esac
          for n in "$MB" "$KEEP"; do
            case "$n" in ''|*[!0-9]*) echo "mb_part, keep: a whole number each"; exit 1 ;; esac
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, read 2026-11-13
        with:
          persist-credentials: false

      - name: LMS-Discography's Sources.pm (the name keys)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, read 2026-11-13
        with:
          repository: SimonArnold002/LMS-Discography
          ref: ${{ env.DSC_REF }}
          path: dsc
          persist-credentials: false
          sparse-checkout: Discography/Sources.pm
          sparse-checkout-cone-mode: false

      - name: Disk space and tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq && sudo apt-get install -y -qq lbzip2
          md5sum dsc/Discography/Sources.pm
          df -h . && free -g && nproc

      - name: Tests (the made-up dump; nothing is built if they fail)
        run: DSC_DIR="$PWD/dsc" python3 -m unittest discover -s tests -v

      - name: Which dump
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="$DUMP"
          [ -n "$B" ] || B=$(python3 -I builder/fetch_dump.py latest)
          case "$B" in *[!0-9-]*|'') echo "not a dump name: $B"; exit 1 ;; esac
          echo "B=$B" >> "$GITHUB_ENV"
          if gh release view "data-$B" > /dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "data-$B is already published"
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      # Two passes of the dump, never on the disk together: today's tables, made into the tables file and deleted; then
      # more.py's, made into its records and deleted. Each kind's bucket count is the builder's own (SIZED); the counts
      # ride in the file's meta.
      - name: Fetch, the tables, the records, the keyed file
        if: steps.which.outputs.build == 'yes'
        run: |
          mkdir -p out
          python3 -I builder/measure_extra.py fetch "$B" work
          python3 -I builder/build_pack.py work out/base.db --dsc "$PWD/dsc" --dump "$B"
          python3 -I builder/measure_extra.py facts work out/facts.db > /dev/null
          python3 -I builder/keyed.py aliases out/base.db "$PWD/dsc" out/aliases.tsv
          df -h .
          rm -rf work
          python3 -I builder/keyed.py narrow out/base.db out/facts.db out/aliases.tsv out/tables.db
          rm -f out/base.db out/facts.db out/aliases.tsv
          python3 -I builder/more.py fetch "$B" work
          python3 -I builder/more.py entries work out/more.db
          df -h .
          rm -rf work
          python3 -I builder/keyed.py entries out/tables.db out/entries.db out/more.db
          rm -f out/more.db
          python3 -I builder/keyed.py keyed out/entries.db out/tables.db sized out/keyed.db
          ls -l out
          df -h .

      - name: The parts and their manifest
        if: steps.which.outputs.build == 'yes'
        run: |
          python3 -I builder/load_parts.py parts out/keyed.db rel "$MB"
          cp "rel/load-$B.json" rel/load.json
          ls -l rel | tail -5
          du -sh rel

      - name: The release
        if: steps.which.outputs.build == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$B"
          if gh release view "$tag" > /dev/null 2>&1; then
            sh builder/replace_release_files.sh "$tag" rel
          else
            gh release create "$tag" rel/* --title "$B" --notes "Built from MusicBrainz's full dump $B (CC0)."
          fi
          gh release view "$tag" --json assets --jq '[.assets[] | .size] | "\(length) files, \(add) bytes"'

      # Only after this build's release is up. Tags sort by their dump's date; a number under 2 is refused, so the
      # release before the newest is always still there for anyone part-way through reading it.
      - name: Older releases deleted (the newest KEEP stay)
        if: steps.which.outputs.build == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$KEEP" in ''|*[!0-9]*) echo "keep: a whole number, please"; exit 1 ;; esac
          [ "$KEEP" -ge 2 ] || { echo "keep: 2 or more"; exit 1; }
          tags=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          old=$(printf '%s\n' "$tags" | grep '^data-' | sort -r | tail -n +"$((KEEP + 1))" || true)
          for t in $old; do
            echo "deleting $t"
            gh release delete "$t" --yes --cleanup-tag
          done
          gh release list --limit 20

      # Last, and on a day with nothing to build too: GitHub switches a public repository's schedules off after 60
      # days without activity, and a release is not a commit (builder/mark_run.sh).
      - name: The last-run file, when the newest commit is two weeks old
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh builder/mark_run.sh "$GITHUB_REPOSITORY" 14 "$MARK"
